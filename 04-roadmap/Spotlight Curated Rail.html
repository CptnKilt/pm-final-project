<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spotlight Curated Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scaled 16:9 TV canvas on the left, a test bench on the right; stacks below 1060px. Deliberately single dark theme (a TV in a dim room). */
:root{
  --ink:#0f1317;
  --panel:#161b21;
  --panel-2:#1e252d;
  --line:#2b333d;
  --text:#ece6da;
  --muted:#949ca6;
  --tungsten:#e9b04f;
  --tungsten-ink:#1c1407;
  --ok:#86bfa1;
  --warn:#e8916a;
  --screen:#0a0d10;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5}
.page{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.top h1 span{color:var(--tungsten)}
.top p{margin:6px 0 0;color:var(--muted);max-width:62ch}
kbd{font-family:var(--font-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--text)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
@media (max-width:1060px){.layout{grid-template-columns:minmax(0,1fr)}}
.tv-col{display:flex;flex-direction:column;gap:12px;min-width:0}

/* TV frame */
.tv-frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line);outline:none}
.tv-frame:focus-visible{box-shadow:0 0 0 2px var(--tungsten)}
.tv{position:absolute;top:0;left:0;width:1280px;height:720px;background:var(--screen);transform-origin:top left;overflow:hidden;font-size:16px;color:var(--text)}
.tv-nav{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:36px;padding:0 56px;z-index:3;background:linear-gradient(180deg,var(--screen) 60%,transparent)}
.logo{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin-right:12px}
.logo b{color:var(--tungsten);font-weight:800}
.nav-item{font-size:17px;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.nav-item.is-current{color:var(--text)}
.nav-item.is-focus{background:var(--text);color:var(--screen)}
.scroller{position:absolute;top:72px;left:0;right:0;bottom:0;overflow:hidden}
.rows{display:flex;flex-direction:column;gap:26px;padding-bottom:120px}
.hero{position:relative;height:250px;margin:0 56px;border-radius:8px;overflow:hidden;display:flex;align-items:flex-end;
  background:radial-gradient(circle at 78% 34%,#f2c46a 0 9%,transparent 10%),linear-gradient(180deg,#6f4a24 0%,#c9a24e 55%,#7a5a22 56%,#3a2a12 100%)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(95deg,var(--screen) 22%,rgba(10,13,16,.75) 48%,rgba(10,13,16,0) 78%)}
.hero-copy{position:relative;padding:26px 30px;display:flex;flex-direction:column;gap:6px;max-width:560px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--tungsten)}
.hero h2{font-family:var(--font-display);font-weight:800;font-size:58px;line-height:.95;margin:0;text-transform:uppercase}
.hero .meta{color:var(--muted);font-size:15px}
.hero p{margin:0;font-size:16px;max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 17px var(--font-body);padding:10px 20px;border-radius:6px;background:#2a313a;color:var(--text);border:0;cursor:pointer;width:max-content}
.btn.is-focus{background:var(--tungsten);color:var(--tungsten-ink);box-shadow:0 0 0 3px rgba(233,176,79,.35)}
.row-head{padding:0 56px;display:flex;flex-direction:column;gap:2px}
.row-head h3{margin:0;font-size:20px;font-weight:600}
.spot-h{margin:0;font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.spot-blurb{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:70ch}
.track{position:relative;display:flex;gap:16px;overflow:hidden;padding:14px 56px}
.tile{position:relative;flex:0 0 auto;border-radius:6px;cursor:pointer;transition:transform .15s ease}
.tile.is-focus{transform:scale(1.06);outline:3px solid var(--tungsten);outline-offset:3px;z-index:2}
.poster{position:relative;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-sizing:border-box;flex:0 0 auto}
.p-year{font-family:var(--font-mono);font-size:11px;color:rgba(244,239,228,.8)}
.p-title{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:.92;text-transform:uppercase;color:#f4efe4;text-shadow:0 2px 8px rgba(0,0,0,.55);text-wrap:balance}
.poster-missing{background:var(--panel-2);border:1px dashed #46505c;justify-content:center;gap:4px;text-align:center}
.pm-title{font-weight:600;font-size:16px;line-height:1.2}
.pm-year{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tungsten)}
.sp-caption{padding:2px 56px 0;font-size:15px;color:var(--muted);min-height:22px}
.sp-caption b{color:var(--text);font-weight:600}
.sp-card{flex:0 0 auto;display:flex;gap:20px;width:620px;height:192px;background:var(--panel-2);border-radius:8px;outline:3px solid var(--tungsten);outline-offset:3px;overflow:hidden}
.sp-info{display:flex;flex-direction:column;gap:5px;padding:12px 18px 12px 0;min-width:0}
.sp-part{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-title{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase}
.sp-meta{font-size:14px;color:var(--muted)}
.sp-log{margin:0;font-size:15px;line-height:1.35}
.sp-actions{display:flex;gap:10px;margin-top:auto;align-items:center}
.sp-actions .btn{font-size:15px;padding:8px 16px}
.sp-prog{font-size:13px;color:var(--muted)}
.thumb{position:relative;width:212px;height:119px;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;padding:10px 12px;box-sizing:border-box}
.thumb span{font-weight:600;font-size:15px;color:#f4efe4;text-shadow:0 1px 6px rgba(0,0,0,.6);line-height:1.2}
.thumb .bar{bottom:6px}
.tv-toast{position:absolute;top:22px;right:28px;z-index:6;display:flex;align-items:center;gap:10px;background:rgba(30,37,45,.95);border:1px solid var(--line);padding:12px 18px;border-radius:999px;font-size:16px;animation:toast 3s ease forwards}
.tv-toast::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tungsten);flex:0 0 auto}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}

/* Playback */
.pb{position:absolute;inset:0;z-index:4}
.pb-mark{position:absolute;top:44%;left:0;right:0;text-align:center;transform:translateY(-50%);font-family:var(--font-display);font-weight:800;font-size:96px;text-transform:uppercase;color:rgba(244,239,228,.12);letter-spacing:.04em}
.pb-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pb-start{font-size:20px;color:var(--muted)}
.pb-err{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 32px;max-width:520px;display:flex;flex-direction:column;gap:10px}
.pb-err h3{margin:0;font-size:24px}
.pb-err p{margin:0;color:var(--muted)}
.pb-actions{display:flex;gap:12px;margin-top:8px}
.pb-bar{position:absolute;left:0;right:0;bottom:0;padding:60px 56px 34px;background:linear-gradient(0deg,rgba(5,6,7,.95) 40%,transparent);display:flex;flex-direction:column;gap:12px}
.pb-title{font-family:var(--font-display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.pb-src{font-size:14px;color:var(--muted)}
.pb-track{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.pb-track i{display:block;height:100%;background:var(--tungsten)}
.pb-times{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-ctrl{display:flex;gap:12px;align-items:center}
.pb-note{margin-left:auto;font-size:13px;color:var(--muted)}

/* Remote */
.remote{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.remote button{font:500 14px var(--font-body);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;min-width:44px}
.remote button:active{background:var(--panel-2)}
.remote .ok{background:var(--tungsten);color:var(--tungsten-ink);border-color:var(--tungsten)}
.remote-label{font-size:13px;color:var(--muted);margin-right:4px}

/* Bench */
.bench{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content}
.seg button{font:500 14px var(--font-body);background:transparent;color:var(--muted);border:0;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--tungsten)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--tungsten)}
.sub{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b{font:600 14px var(--font-body);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.b.primary{background:var(--tungsten);color:var(--tungsten-ink);border-color:var(--tungsten)}
.b:focus-visible,.seg button:focus-visible,.remote button:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
.pending{font-size:13px;color:var(--tungsten)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.off{background:var(--muted)}.dot.warn{background:var(--warn)}
.audit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13px}
.audit li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-top:1px solid var(--line);align-items:baseline}
.audit li:first-child{border-top:0}
.audit .n{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.audit .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:rgba(134,191,161,.15);color:var(--ok)}
.chip.no{background:rgba(232,145,106,.14);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.good{color:var(--ok)}
.log{list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:12px;max-height:300px;overflow:auto;display:flex;flex-direction:column}
.log li{padding:6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.log li:first-child{border-top:0}
.log .ev{color:var(--text)}
.log .ev.spot{color:var(--tungsten)}
.log .t{color:var(--muted);margin-right:8px}
.log .p{color:var(--muted);word-break:break-word}
@media (prefers-reduced-motion:reduce){
  .tile{transition:none}
  .tv-toast{animation:none}
}
</style>

<div class="page">

  </header>
  <div id="root"></div>
</div>

<script>
(function(){
const { useState, useEffect, useRef } = React;

    else if ((progress[id] || 0) >= 90 || (s.heavyDevotee && HEAVY_DEVOTEE_SEEN.includes(id))) reason = 'Already watched';
    else if (ids.length >= 12) reason = 'Over 12-title cap';
    if (t) seen.add(id);
    if (!reason) ids.push(id);
    audit.push({pos:i+1, id, name: t ? t.title : id, reason});
  });
  if (ids.length < 8) return {status:'suppressed', ids:[], valid:ids.length, audit, reason:`Only ${ids.length} valid titles (minimum is 8)`};
  return {status:'ok', ids, valid:ids.length, audit};
}

/* ---------- Small components ---------- */
function Poster({t, missing}){
  if (missing) return h('div', {className:'poster poster-missing', style:{width:128,height:192}},
    h('span', {className:'pm-title'}, t.title), h('span', {className:'pm-year'}, t.year));
  return h('div', {className:'poster', style:{width:128,height:192,background:posterBg(t)}},
    h('span', {className:'p-year'}, t.year), h('span', {className:'p-title'}, t.title));
}

function useScale(ref){
  const [scale, setScale] = useState(0.5);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(entries => { const w = entries[0].contentRect.width; if (w) setScale(w / 1280); });
    ro.observe(ref.current); return () => ro.disconnect();
  }, []);
  return scale;
}

/* ---------- App ---------- */
function App(){
  const initialSettings = {group:'exposed', profile:'adult', heavyDevotee:false, serviceDown:false, posterMissing:false};
  const [settings, setSettings] = useState(initialSettings);
  const [applied, setApplied] = useState(initialSettings);
  const [live, setLive] = useState({pulled:false, playbackFails:false});
  const [progress, setProgress] = useState(INITIAL_PROGRESS);
  const [rail, setRail] = useState({status:'loading', ids:[], audit:[]});
  const [screen, setScreen] = useState('home');           // 'home' | 'focus' | 'playback'
  const [focus, setFocus] = useState({row:'hero', col:0});
  const [rowCols, setRowCols] = useState({});
  const [actionIdx, setActionIdx] = useState(0);
  const [pb, setPb] = useState(null);
  const [pbFocus, setPbFocus] = useState(1);
  const [toast, setToast] = useState(null);
  const [events, setEvents] = useState([]);
  const [session, setSession] = useState({watchSec:0, reached:false, spotlight:false});
  const [impressionAt, setImpressionAt] = useState(null);
  const [ttp, setTtp] = useState(null);

  const frameRef = useRef(null), scrollerRef = useRef(null);
  const rowRefs = useRef({}), trackRefs = useRef({});
  const liveRef = useRef(live); liveRef.current = live;
  const reqRef = useRef(0);
  const scale = useScale(frameRef);

  const log = (name, props = {}) => {
    console.log('[spotlight]', name, Object.assign({user_id:USER_ID}, props));
    const time = new Date().toTimeString().slice(0, 8);
    setEvents(ev => [{key: Math.random().toString(36).slice(2), time, name, props}, ...ev].slice(0, 80));
  };
  const showToast = text => setToast({text, id: Date.now() + Math.random()});
  useEffect(() => { if (!toast) return; const id = toast.id; const tm = setTimeout(() => setToast(t => (t && t.id === id ? null : t)), 3000); return () => clearTimeout(tm); }, [toast]);

  const loadHome = (s) => {
    const r = computeRail(s, progress, live.pulled);
    setApplied(s); setRail(r); setScreen('home'); setPb(null);
    setFocus({row:'hero', col:0}); setRowCols({}); setActionIdx(0); setTtp(null);
    log('home_load', {exposure_group:s.group, profile:s.profile});
    if (r.status === 'ok') {
      setImpressionAt(Date.now());
      log('spotlight_rail_impression', {collection_id:COLLECTION.id, exposure_group:s.group, tile_count:r.ids.length});
      if (s.posterMissing && r.ids.includes(POSTER_MISSING_ID)) log('poster_asset_missing', {title_id:POSTER_MISSING_ID});
    } else {
      setImpressionAt(null);
      if (r.status === 'suppressed') log('spotlight_suppressed', {collection_id:COLLECTION.id, reason:'below_minimum', valid_titles:r.valid});
      if (r.status === 'error') setTimeout(() => log('spotlight_load_error', {collection_id:COLLECTION.id, timeout_ms:2000}), 2000);
    }
  };
  useEffect(() => { loadHome(initialSettings); }, []);

  const rows = ['nav', 'hero'].concat(rail.status === 'ok' ? ['spotlight'] : [], ['continue', 'because', 'trending']);
  const rowLen = k => ({nav:NAV.length, hero:1, spotlight:rail.ids.length, continue:CONTINUE.length, because:BECAUSE.items.length, trending:TRENDING.items.length})[k] || 1;
  const logTileFocus = col => { const id = rail.ids[col]; if (id) log('spotlight_tile_focus', {collection_id:COLLECTION.id, title_id:id, tile_position:col+1}); };

  /* Keep the focused row and tile in view */
  useEffect(() => {
    if (screen === 'playback') return;
    const behavior = reducedMotion() ? 'auto' : 'smooth';
    const sc = scrollerRef.current, rowEl = rowRefs.current[focus.row];
    if (sc && focus.row !== 'nav') sc.scrollTo({top: focus.row === 'hero' || !rowEl ? 0 : Math.max(0, rowEl.offsetTop - 18), behavior});
    const tr = trackRefs.current[focus.row];
    if (tr && tr.children[focus.col]) tr.scrollTo({left: Math.max(0, tr.children[focus.col].offsetLeft - 56), behavior});
  }, [focus, screen, rail]);

  /* ---------- Navigation ---------- */
  const moveRow = dr => {
    const cur = rows.indexOf(focus.row); const ni = clamp(cur + dr, 0, rows.length - 1);
    if (ni === cur) return;
    const nr = rows[ni]; const saved = Object.assign({}, rowCols, {[focus.row]: focus.col});
    setRowCols(saved);
    const nc = Math.min(saved[nr] || 0, rowLen(nr) - 1);
    setFocus({row:nr, col:nc});
    if (nr === 'spotlight') logTileFocus(nc);
  };
  const moveCol = dc => {
    const nc = clamp(focus.col + dc, 0, rowLen(focus.row) - 1);
    if (nc === focus.col) return;
    setFocus({row:focus.row, col:nc});
    if (focus.row === 'spotlight') logTileFocus(nc);
  };

  const select = (row, col) => {
    if (row === 'nav') { showToast(col === 0 ? "You're on Home." : `${NAV[col]} isn't part of this prototype.`); return; }
    if (row === 'hero') { showToast("The full title page isn't part of this prototype."); return; }
    if (row === 'spotlight') {
      log('spotlight_tile_select', {collection_id:COLLECTION.id, title_id:rail.ids[col], tile_position:col+1});
      setActionIdx(0); setScreen('focus'); return;
    }
    if (row === 'continue') { const c = CONTINUE[col]; startPlayback({title:c, source:'continue_watching', col, startPct:c.pct}); return; }
    showToast("This existing row isn't wired up in the prototype.");
  };
  const clickTile = (row, col) => {
    if (screen === 'focus' && row === 'spotlight' && col === focus.col) return;
    setFocus({row, col}); setScreen('home');
    if (row === 'spotlight' && !(focus.row === 'spotlight' && focus.col === col)) logTileFocus(col);
    select(row, col);
  };

  const activateAction = idx => {
    const i = idx == null ? actionIdx : idx;
    const id = rail.ids[focus.col]; const t = TITLE_MAP[id];
    if (i === 1) { showToast("The full title page isn't part of this prototype."); return; }
    if (live.pulled && id === PULLED_ID) {
      log('spotlight_title_unavailable', {collection_id:COLLECTION.id, title_id:id, tile_position:focus.col+1});
      showToast('This title is no longer available.');
      const next = focus.col + 1 < rail.ids.length ? focus.col + 1 : Math.max(0, focus.col - 1);
      setScreen('home'); setFocus({row:'spotlight', col:next}); logTileFocus(next); return;
    }
    const pct = progress[id] || 0;
    startPlayback({title:t, source:'spotlight', col:focus.col, startPct: pct > 0 && pct < 90 ? pct : 0});
  };

  const startPlayback = (args) => {
    const req = ++reqRef.current;
    setPb(Object.assign({}, args, {elapsed:0, playing:false, status:'starting'}));

    setTimeout(() => {
      if (reqRef.current !== req) return;
      if (liveRef.current.playbackFails) {

      }
      setPb(p => p && Object.assign({}, p, {status:'playing', playing:true}));
      const props = {source:args.source, title_id:args.title.id, resume:args.startPct > 0};
      if (args.source === 'spotlight') {
        Object.assign(props, {collection_id:COLLECTION.id, tile_position:args.col + 1});

  };

  const advance = sec => {
    if (!pb || pb.status !== 'playing') return;
    const runtimeSec = pb.title.runtime * 60; const startSec = pb.startPct / 100 * runtimeSec;
    const d = Math.min(sec, runtimeSec - startSec - pb.elapsed);
    if (d <= 0) { setPb(Object.assign({}, pb, {playing:false})); return; }
    const ne = pb.elapsed + d;
    setPb(Object.assign({}, pb, {elapsed:ne}));
    if (Math.floor(ne / 60) > Math.floor(pb.elapsed / 60)) log('watch_heartbeat', {source:pb.source, title_id:pb.title.id, watched_sec:Math.round(ne)});
    const nw = session.watchSec + d; let reached = session.reached;
    if (!reached && nw >= 1800) {

    }
    setSession(Object.assign({}, session, {watchSec:nw, reached}));
  };
  const tickRef = useRef(); tickRef.current = () => { if (pb && pb.status === 'playing' && pb.playing) advance(SIM_SPEED); };
  useEffect(() => { const iv = setInterval(() => tickRef.current(), 1000); return () => clearInterval(iv); }, []);

  const exitPlayback = () => {
    const p = pb; reqRef.current++;
    if (!p) { setScreen('home'); return; }
    if (p.status === 'playing') {
      if (p.source === 'spotlight' && p.elapsed < 120) {
        log('spotlight_early_exit', {collection_id:COLLECTION.id, title_id:p.title.id, watched_sec:Math.round(p.elapsed)});
        if (!session.reached) setSession(s => Object.assign({}, s, {watchSec:Math.max(0, s.watchSec - p.elapsed)}));
      } else log('playback_exit', {source:p.source, title_id:p.title.id, watched_sec:Math.round(p.elapsed)});
    }
    setPb(null); setScreen('home');
    if (p.source === 'spotlight') {
      if (p.status === 'playing' && p.elapsed >= 120) {
        const pct = Math.min(100, p.startPct + p.elapsed / (p.title.runtime * 60) * 100);

      }

  };

  const pbAction = i => {
    if (!pb) return;
    if (pb.status === 'error') { if (i === 0) exitPlayback(); else startPlayback({title:pb.title, source:pb.source, col:pb.col, startPct:pb.startPct}); return; }
    if (pb.status !== 'playing') { if (i === 0) exitPlayback(); return; }
    if (i === 0) exitPlayback();
    else if (i === 1) setPb(Object.assign({}, pb, {playing:!pb.playing}));

      if (a === 'back') return exitPlayback();

      if (a === 'left') setPbFocus(f => clamp(f - 1, 0, n - 1));

      else setScreen('home');
      return;
    }

    else if (a === 'left') moveCol(-1); else if (a === 'right') moveCol(1);
    else if (a === 'ok') select(focus.row, focus.col);

      const a = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', Enter:'ok', Escape:'back', Backspace:'back'}[ev.key];

      h('div', {className:'eyebrow'}, 'Featured tonight'),

      h('div', {className:'meta'}, HERO.meta),
      h('p', null, HERO.blurb),
      h('div', {style:{marginTop:8}}, h('button', {className:'btn' + (isF('hero', 0) ? ' is-focus' : ''), tabIndex:-1, onClick:() => clickTile('hero', 0)}, 'More info'))));

      h('h2', {className:'spot-h'}, COLLECTION.heading),
      h('p', {className:'spot-blurb'}, COLLECTION.blurb)),
    h('div', {className:'track', ref:trackRef('spotlight')}, rail.ids.map((id, i) => {
      const t = TITLE_MAP[id]; const pct = progress[id] || 0; const inProg = pct > 0 && pct < 90;

        return h('div', {key:id, className:'sp-card'},
          h(Poster, {t, missing}),
          h('div', {className:'sp-info'},
            h('div', {className:'sp-part'}, 'Part of Spotlight: ' + COLLECTION.heading),
            h('div', {className:'sp-title'}, t.title),
            h('div', {className:'sp-meta'}, `${t.year} · ${fmtRuntime(t.runtime)} · ${t.rating} · ${t.director}`),
            h('p', {className:'sp-log'}, t.logline),
            h('div', {className:'sp-actions'},
              h('button', {className:'btn' + (actionIdx === 0 ? ' is-focus' : ''), tabIndex:-1, onClick:() => { setActionIdx(0); activateAction(0); }}, '▶ ' + (inProg ? 'Resume' : 'Play')),
              h('button', {className:'btn' + (actionIdx === 1 ? ' is-focus' : ''), tabIndex:-1, onClick:() => { setActionIdx(1); activateAction(1); }}, 'More info'),
              inProg && h('span', {className:'sp-prog'}, `${Math.round(pct)}% watched`))));
      }
      return h('div', {key:id, className:'tile' + (isF('spotlight', i) ? ' is-focus' : ''), onClick:() => clickTile('spotlight', i)},
        h(Poster, {t, missing}),
        inProg && h('div', {className:'bar'}, h('i', {style:{width:pct + '%'}})));
    })),
    h('div', {className:'sp-caption'}, screen === 'home' && focus.row === 'spotlight' && rail.ids[focus.col]
      ? [h('b', {key:'b'}, TITLE_MAP[rail.ids[focus.col]].title), ` · ${TITLE_MAP[rail.ids[focus.col]].year} · ${TITLE_MAP[rail.ids[focus.col]].director} · Press OK for details`]

  const thumbRow = (key, heading, items, getProps) => h('section', {key, ref:rowRef(key)},

    h('div', {className:'track', ref:trackRef(key)}, items.map((it, i) => {

      thumbRow('trending', TRENDING.heading, TRENDING.items, (n, i) => ({label:n, bg:`linear-gradient(150deg, ${THUMB_COLORS[(i + 2) % 5][1]}, ${THUMB_COLORS[(i + 2) % 5][0]})`}))));

  let playback = null;
  if (screen === 'playback' && pb) {

      pb.status !== 'error' && h('div', {className:'pb-mark'}, t.title),
      pb.status === 'starting' && h('div', {className:'pb-center'}, h('div', {className:'pb-start'}, `Starting ${t.title}…`)),
      pb.status === 'error' && h('div', {className:'pb-center'}, h('div', {className:'pb-err'},
        h('h3', null, "We couldn't start this film"),
        h('p', null, "The stream didn't begin within 10 seconds. Check your connection, then try again."),
        h('div', {className:'pb-actions'}, pbBtn('Back', 0), pbBtn('Retry', 1)))),
      pb.status === 'playing' && h('div', {className:'pb-bar'},
        h('div', null, h('div', {className:'pb-title'}, t.title),
          h('div', {className:'pb-src'}, pb.source === 'spotlight' ? `From Spotlight: ${COLLECTION.heading}` : 'From Continue watching')),
        h('div', {className:'pb-track'}, h('i', {style:{width:(pos / runtimeSec * 100) + '%'}})),

  const bench = h('aside', {className:'bench'},
    h('div', {className:'card'},
      h('h2', null, 'Test bench'),
      h('div', {className:'sub'}, 'Applies on next homepage load'),
      h('div', {className:'field'}, h('span', {className:'field-label'}, 'Simulated assignment'), seg('group', [['exposed', 'Exposed'], ['holdout', 'Holdout']])),

      h('div', {className:'actions'},
        h('button', {id:'new-session', className:'b', onClick:() => { setSession({watchSec:0, reached:false, spotlight:false}); log('session_start', {}); }}, 'Start new session'))),
    h('div', {className:'card'},
      h('h2', null, 'Rail check'),
      h('div', {className:'status'}, h('span', {className:'dot ' + statusLine[0]}), statusLine[1]),
      rail.reason && h('p', {className:'note'}, rail.reason + '. The rest of the homepage loads normally.'),

        h('li', {key:a.pos},
          h('span', {className:'n'}, a.pos),

          h('span', {className:'chip ' + (a.reason ? 'no' : 'ok')}, a.reason || 'Shown')))) : null,
      h('p', {className:'note'}, `Editor list for ${COLLECTION.id}, in editor order. Collection changes reach this screen on the next homepage load, never mid-browse.`)),
    h('div', {className:'card'},
      h('h2', null, 'Session'),
      h('dl', {className:'stats'},
        h('dt', null, 'Watch time this session'), h('dd', null, `${fmtClock(session.watchSec)} / 30:00`),
        h('dt', null, '30+ minute session'), h('dd', {className:session.reached ? 'good' : ''}, session.reached ? 'Reached' : 'Not yet'),
        h('dt', null, 'Included a Spotlight play'), h('dd', null, session.spotlight ? 'Yes' : 'No'),
        h('dt', null, 'Rail impression to Play'), h('dd', {className: ttp != null && ttp <= 60 ? 'good' : ''}, ttp == null ? '—' : `${ttp.toFixed(1)}s`)),
      h('p', {className:'note'}, 'Eval target: median 60 seconds or less from rail impression to Play.')),
    h('div', {className:'card'},
      h('h2', null, 'Event log'),
      h('ul', {className:'log', 'aria-live':'polite'}, events.map(ev =>
        h('li', {key:ev.key},
          h('div', null, h('span', {className:'t'}, ev.time), h('span', {className:'ev' + (ev.name.indexOf('spotlight') === 0 || ev.props.source === 'spotlight' ? ' spot' : '')}, ev.name)),
          Object.keys(ev.props).length ? h('div', {className:'p'}, Object.entries(ev.props).map(([k, v]) => `${k}=${v}`).join('  ')) : null))),
      h('p', {className:'note'}, 'Every event is also written to the browser console with the user ID. No personal information is logged.')));

  return h('div', {className:'layout'},
    h('div', {className:'tv-col'},
      h('div', {className:'tv-frame', ref:frameRef, tabIndex:0, 'aria-label':'TV screen. Use arrow keys, Enter and Escape.', onMouseDown:() => frameRef.current && frameRef.current.focus()}, tv),
      h('div', {className:'remote'},
        h('span', {className:'remote-label'}, 'Remote'),
        btnRemote('◀', 'left'), btnRemote('▲', 'up'), btnRemote('▼', 'down'), btnRemote('▶', 'right'),
        btnRemote('OK', 'ok', 'ok'), btnRemote('Back', 'back'))),
    bench);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
